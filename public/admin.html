<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRX SPORT - Irodai Érkeztető Panel</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        h1 { color: #e10600; text-align: center; margin-bottom: 30px; }
        .card {
            background-color: #1e1e1e;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }
        h2 { color: #fff; border-bottom: 2px solid #e10600; padding-bottom: 10px; margin-top: 0; }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #ccc;
        }
        input[type="text"], input[type="time"], select {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: white;
            box-sizing: border-box;
            font-size: 16px;
        }
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            background: #2a2a2a;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #444;
        }
        .checkbox-group label {
            font-weight: normal;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .btn-submit {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: 0.2s;
        }
        .btn-submit:hover { background-color: #218838; }
        
        .table-responsive { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background-color: #1a1a1a;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #333;
        }
        th { background-color: #252525; color: #aaa; }
        
        /* Státusz jelvények */
        .status-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
        }
        .status-yellow { background-color: #ffcc00; color: #000; }
        .status-green { background-color: #28a745; color: #fff; }
        .status-blue { background-color: #007bff; color: #fff; }
        .status-gray { background-color: #6c757d; color: #fff; }
        
        .eszrevetel-szoveg { color: #ffcc00; font-style: italic; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏢 DRX SPORT - Irodai Érkeztető Panel</h1>
        
        <!-- ÚJ VENDÉG FELVÉTELE FORM -->
        <div class="card">
            <h2>Vendég Regisztráció</h2>
            <form id="irodaForm">
                <div class="form-group">
                    <label for="vendegId">Egyedi Azonosítószám (QR kódhoz):</label>
                    <input type="text" id="vendegId" required placeholder="Pl. DRX101">
                </div>

                <div class="form-group">
                    <label for="vendegNev">Vendég Neve:</label>
                    <input type="text" id="vendegNev" required placeholder="Pl. Kovács János">
                </div>

                <div class="form-group">
                    <label for="idopont">Vezetés Tervezett Időpontja:</label>
                    <input type="time" id="idopont" required>
                </div>

                <div class="form-group">
                    <label for="autoLista">Autó Típusa:</label>
                    <select id="autoLista" required></select>
                </div>

                <div class="form-group">
                    <label for="korszam">Körök Száma:</label>
                    <select id="korszam" required></select>
                </div>

                <div class="form-group">
                    <label>Extra Szolgáltatások:</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="extra" value="Teljes média"> Teljes média</label>
                        <label><input type="checkbox" name="extra" value="Hűtőmágnes"> Hűtőmágnes</label>
                        <label><input type="checkbox" name="extra" value="TikTok"> TikTok videó</label>
                        <label><input type="checkbox" name="extra" value="Extra utas"> Extra utas</label>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Vendég Mentése (Megérkezett)</button>
            </form>
        </div>

        <!-- ÉLŐ VENDÉGLISTA ÉS STATISZTIKA -->
        <div class="card">
            <h2>Regisztrált Vendégek és Értékelések</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Azonosító</th>
                            <th>Név</th>
                            <th>Időpont</th>
                            <th>Autó</th>
                            <th>Kör</th>
                            <th>Extrák</th>
                            <th>Állapot</th>
                            <th>Értékelés</th>
                            <th>Észrevétel</th>
                        </tr>
                    </thead>
                    <tbody id="irodaVendegLista"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Funkció a listák kezdeti feltöltéséhez
        function listakBetoltese() {
            // Körök feltöltése
            const korszamSelect = document.getElementById('korszam');
            korszamSelect.innerHTML = '';
            for (let i = 1; i <= 15; i++) {
                let opt = document.createElement('option');
                opt.value = i;
                opt.innerHTML = `${i} kör`;
                if(i === 5) opt.selected = true; // Alapértelmezett 5 kör
                korszamSelect.appendChild(opt);
            }

            // Autók feltöltése API-ból
            fetch('/api/autok')
                .then(res => res.json())
                .then(autok => {
                    const autoSelect = document.getElementById('autoLista');
                    autoSelect.innerHTML = '';
                    autok.forEach(auto => {
                        let opt = document.createElement('option');
                        opt.value = auto;
                        opt.innerHTML = auto;
                        autoSelect.appendChild(opt);
                    });
                });
        }

        // Első betöltés futtatása
        listakBetoltese();

        const socket = io();

        // Űrlap elküldése
        document.getElementById('irodaForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const checkedExtras = [];
            document.querySelectorAll('input[name="extra"]:checked').forEach(cb => {
                checkedExtras.push(cb.value);
            });

            const ujVendeg = {
                id: document.getElementById('vendegId').value,
                nev: document.getElementById('vendegNev').value,
                idopont: document.getElementById('idopont').value,
                auto: document.getElementById('autoLista').value,
                korszam: document.getElementById('korszam').value,
                extra: checkedExtras
            };

            socket.emit('ujVendeg', ujVendeg);
            
            // Reset és az autó/kör listák biztonságos újragenerálása
            document.getElementById('irodaForm').reset();
            listakBetoltese();
        });

        socket.on('hiba', (uzenet) => {
            alert(uzenet);
        });

        // Táblázat élő frissítése
        socket.on('vendegekFrissitese', (vendegek) => {
            const tbody = document.getElementById('irodaVendegLista');
            tbody.innerHTML = '';

            vendegek.forEach(v => {
                const tr = document.createElement('tr');
                
                let statusClass = '';
                let statusText = v.status;
                if (v.status === 'MEGÉRKEZETT') statusClass = 'status-yellow';
                if (v.status === 'VEZETÉSRE_VÁR') statusClass = 'status-green';
                if (v.status === 'BEHÍVVA') statusClass = 'status-blue';
                if (v.status === 'TELJESÍTETT') {
                    statusClass = 'status-gray';
                    statusText = 'Teljesítve';
                }

                tr.innerHTML = `
                    <td><strong>${v.id}</strong></td>
                    <td>${v.nev}</td>
                    <td>${v.idopont}</td>
                    <td>${v.auto}</td>
                    <td>${v.korszam} kör</td>
                    <td>${v.extra.join(', ') || 'Nincs'}</td>
                    <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                    <td>${v.ertekeles ? `⭐ ${v.ertekeles}/10` : '-'}</td>
                    <td><i class="eszrevetel-szoveg">${v.eszrevetel || '-'}</i></td>
                `;
                tbody.appendChild(tr);
            });
        });
    </script>
</body>
</html>
