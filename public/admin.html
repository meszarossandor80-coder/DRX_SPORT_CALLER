<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRX SPORT - Irodai Érkeztető Panel</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1>🏢 DRX SPORT - Irodai Érkeztető Panel</h1>
        
        <!-- ÚJ VENDÉG FELVÉTELE FORM -->
        <div class="card">
            <h2>Vendég Regisztráció</h2>
            <form id="irodaForm">
                <div class="form-group">
                    <label for="vendegId">Egyedi Azonosítószám (QR kódhoz):</label>
                    <input type="text" id="vendegId" required placeholder="Pl. DRX101">
                </div>

                <div class="form-group">
                    <label for="vendegNev">Vendég Neve:</label>
                    <input type="text" id="vendegNev" required placeholder="Pl. Kovács János">
                </div>

                <div class="form-group">
                    <label for="idopont">Vezetés Tervezett Időpontja:</label>
                    <input type="time" id="idopont" required>
                </div>

                <div class="form-group">
                    <label for="autoLista">Autó Típusa:</label>
                    <select id="autoLista" required>
                        <!-- A szerver automatikusan feltölti a 13 autóval -->
                    </select>
                </div>

                <div class="form-group">
                    <label for="korszam">Körök Száma:</label>
                    <select id="korszam" required>
                        <!-- JavaScript fogja feltölteni 1-től 15-ig -->
                    </select>
                </div>

                <div class="form-group">
                    <label>Extra Szolgáltatások:</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="extra" value="Teljes média"> Teljes média</label>
                        <label><input type="checkbox" name="extra" value="Hűtőmágnes"> Hűtőmágnes</label>
                        <label><input type="checkbox" name="extra" value="TikTok"> TikTok videó</label>
                        <label><input type="checkbox" name="extra" value="Extra utas"> Extra utas</label>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Vendég Mentése (Megérkezett)</button>
            </form>
        </div>

        <!-- ÉLŐ VENDÉGLISTA ÉS STATISZTIKA -->
        <div class="card">
            <h2>Regisztrált Vendégek és Értékelések</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Azonosító</th>
                            <th>Név</th>
                            <th>Időpont</th>
                            <th>Autó</th>
                            <th>Kör</th>
                            <th>Extrák</th>
                            <th>Állapot</th>
                            <th>Értékelés</th>
                            <th>Észrevétel</th>
                        </tr>
                    </thead>
                    <tbody id="irodaVendegLista">
                        <!-- Ide érkeznek valós időben a vendégek -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Socket.io és Kliens JS -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        // Feltöltjük a körszámokat 1-től 15-ig a legördülőben
        const korszamSelect = document.getElementById('korszam');
        for (let i = 1; i <= 15; i++) {
            let opt = document.createElement('option');
            opt.value = i;
            opt.innerHTML = `${i} kör`;
            korszamSelect.appendChild(opt);
        }

        // Lekérjük a 13 autót a szerverről automatikusan
        fetch('/api/autok')
            .then(res => res.json())
            .then(autok => {
                const autoSelect = document.getElementById('autoLista');
                autok.forEach(auto => {
                    let opt = document.createElement('option');
                    opt.value = auto;
                    opt.innerHTML = auto;
                    autoSelect.appendChild(opt);
                });
            });

        // Csatlakozás a szerverhez valós időben
        const socket = io();

        // Űrlap elküldése (Vendég regisztráció)
        document.getElementById('irodaForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            // Kiválasztott checkboxok összegyűjtése
            const checkedExtras = [];
            document.querySelectorAll('input[name="extra"]:checked').forEach(cb => {
                checkedExtras.push(cb.value);
            });

            const ujVendeg = {
                id: document.getElementById('vendegId').value,
                nev: document.getElementById('vendegNev').value,
                idopont: document.getElementById('idopont').value,
                auto: document.getElementById('autoLista').value,
                korszam: document.getElementById('korszam').value,
                extra: checkedExtras
            };

            socket.emit('ujVendeg', ujVendeg);
            document.getElementById('irodaForm').reset();
            // Újraépítjük a körszámokat a reset után
            korszamSelect.innerHTML = '';
            for (let i = 1; i <= 15; i++) {
                let opt = document.createElement('option');
                opt.value = i;
                opt.innerHTML = `${i} kör`;
                korszamSelect.appendChild(opt);
            }
        });

        // Hibaüzenet kezelése (pl. ha már létezik az ID)
        socket.on('hiba', (uzenet) => {
            alert(uzenet);
        });

        // Élő táblázat frissítése a szerverről kapott adatokkal
        socket.on('vendegekFrissitese', (vendegek) => {
            const tbody = document.getElementById('irodaVendegLista');
            tbody.innerHTML = '';

            vendegek.forEach(v => {
                const tr = document.createElement('tr');
                
                // Állapot szín beállítása a logikád szerint
                let statusClass = '';
                let statusText = v.status;
                if (v.status === 'MEGÉRKEZETT') statusClass = 'status-yellow';
                if (v.status === 'VEZETÉSRE_VÁR') statusClass = 'status-green';
                if (v.status === 'BEHÍVVA') statusClass = 'status-blue';
                if (v.status === 'TELJESÍTETT') {
                    statusClass = 'status-gray';
                    statusText = 'Teljesítve';
                }

                tr.innerHTML = `
                    <td><strong>${v.id}</strong></td>
                    <td>${v.nev}</td>
                    <td>${v.idopont}</td>
                    <td>${v.auto}</td>
                    <td>${v.korszam} kör</td>
                    <td>${v.extra.join(', ') || 'Nincs'}</td>
                    <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                    <td>${v.ertekeles ? `⭐ ${v.ertekeles}/10` : '-'}</td>
                    <td><i class="eszrevetel-szoveg">${v.eszrevetel || '-'}</i></td>
                `;
                tbody.appendChild(tr);
            });
        });
    </script>
</body>
</html>
