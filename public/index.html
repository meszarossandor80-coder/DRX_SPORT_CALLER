<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRX SPORT - Vendég Bejelentkezés</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .guest-container { max-width: 500px; margin: 0 auto; padding: 15px; }
        .big-number { font-size: 64px; font-weight: bold; color: #ffcc00; text-align: center; margin: 20px 0; }
        .rating-btn { padding: 12px; font-size: 18px; background: #333; color: white; border: 1px solid #444; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .rating-btn.active { background: #ffcc00; color: black; border-color: #ffcc00; }
        .rating-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 15px 0; }
        textarea { width: 100%; height: 80px; background: #333; color: white; border: 1px solid #444; padding: 10px; border-radius: 4px; resize: none; }
    </style>
</head>
<body>
    <div class="guest-container">
        <h1>🏎️ DRX SPORT</h1>

        <div id="phase-login" class="card">
            <h2>Üdvözlünk a pályán!</h2>
            <p style="margin-bottom: 15px; color: #aaa;">Kérjük, add meg az egyedi azonosítószámodat.</p>
            <form id="guestLoginForm">
                <div class="form-group">
                    <label for="guestId">Egyedi azonosító:</label>
                    <input type="text" id="guestId" required placeholder="Pl. DRX101" style="text-transform: uppercase;">
                </div>
                <button type="submit" class="btn-submit">Azonosítás</button>
            </form>
        </div>

        <div id="phase-arrived" class="card" style="display: none;">
            <div class="status-badge status-yellow" style="width: 100%; padding: 10px; margin-bottom: 20px; font-size: 16px;">Állapot: Megérkezett</div>
            <h2 id="arrived-welcome">Szia!</h2>
            <div style="margin: 20px 0; background: #333; padding: 15px; border-radius: 6px;">
                <p><strong>Vezetett autó:</strong> <span id="arrived-car" style="color: #ffcc00;">-</span></p>
                <p style="margin-top: 8px;"><strong>Körök száma:</strong> <span id="arrived-laps">-</span></p>
            </div>
            <button id="btn-checkin" class="btn-submit" style="background-color: #28a745; color: white;">Bejelentkezés vezetésre</button>
        </div>

        <div id="phase-waiting" class="card" style="display: none;">
            <div class="status-badge status-green" style="width: 100%; padding: 10px; margin-bottom: 20px; font-size: 16px;">Állapot: Vezetésre vár</div>
            <h2 style="text-align: center;">Várakozók előtted:</h2>
            <div id="queue-number" class="big-number">-</div>
            <p style="text-align: center; color: #aaa;">Kérjük, maradj a depó közelében!</p>
        </div>

        <div id="phase-called" class="card" style="display: none; border: 3px solid #007bff;">
            <div class="status-badge status-blue" style="width: 100%; padding: 10px; margin-bottom: 20px; font-size: 16px;">Állapot: BEHÍVVA</div>
            <h2 style="text-align: center; color: #007bff; font-size: 26px;">📢 FÁRADJ AZ AUTÓHOZ!</h2>
            <div style="background: #333; padding: 15px; border-radius: 6px; text-align: center; font-size: 20px; color: #ffcc00; margin-top: 15px;" id="called-car">-</div>
        </div>

        <div id="phase-rating" class="card" style="display: none;">
            <h2>Köszönjük a vezetést! 🎉</h2>
            <div class="rating-grid">
                <button type="button" class="rating-btn" onclick="setRating(1)">1</button>
                <button type="button" class="rating-btn" onclick="setRating(2)">2</button>
                <button type="button" class="rating-btn" onclick="setRating(3)">3</button>
                <button type="button" class="rating-btn" onclick="setRating(4)">4</button>
                <button type="button" class="rating-btn" onclick="setRating(5)">5</button>
                <button type="button" class="rating-btn" onclick="setRating(6)">6</button>
                <button type="button" class="rating-btn" onclick="setRating(7)">7</button>
                <button type="button" class="rating-btn" onclick="setRating(8)">8</button>
                <button type="button" class="rating-btn" onclick="setRating(9)">9</button>
                <button type="button" class="rating-btn" onclick="setRating(10)">10</button>
            </div>
            <textarea id="feedback" placeholder="Egyéb észrevételek..."></textarea>
            <button id="btn-submit-rating" class="btn-submit" style="margin-top: 15px;">Küldés</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myId = null;
        let selectedRating = null;

        // Azonosítás közvetlen API-val, ami SOHA nem akad el
        document.getElementById('guestLoginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const inputId = document.getElementById('guestId').value.trim().toUpperCase();
            
            fetch('/api/vendegek')
                .then(res => res.json())
                .then(vendegek => {
                    const me = vendegek.find(v => v.id === inputId);
                    if (!me) {
                        alert("Ez az azonosító nem létezik az irodai listában!");
                    } else {
                        myId = inputId;
                        frissitFelület(vendegek);
                        listenToMyEvents();
                    }
                });
        });

        document.getElementById('btn-checkin').addEventListener('click', () => {
            if (myId) socket.emit('vendegBejelentkezesVezetesre', myId);
        });

        window.setRating = function(num) {
            selectedRating = num;
            document.querySelectorAll('.rating-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        };

        document.getElementById('btn-submit-rating').addEventListener('click', () => {
            if(!selectedRating) { alert("Válassz pontszámot!"); return; }
            socket.emit('ertekelesBekuldese', { vendegId: myId, pontszam: selectedRating, eszrevetel: document.getElementById('feedback').value });
            alert("Köszönjük!");
            location.reload();
        });

        socket.on('vendegekFrissitese', (vendegek) => {
            if (myId) frissitFelület(vendegek);
        });

        function frissitFelület(vendegek) {
            const me = vendegek.find(v => v.id === myId);
            if (!me) return;

            document.getElementById('phase-login').style.display = 'none';
            document.getElementById('phase-arrived').style.display = 'none';
            document.getElementById('phase-waiting').style.display = 'none';
            document.getElementById('phase-called').style.display = 'none';
            document.getElementById('phase-rating').style.display = 'none';

            if (me.status === 'MEGÉRKEZETT') {
                document.getElementById('phase-arrived').style.display = 'block';
                document.getElementById('arrived-welcome').innerHTML = `Szia, ${me.nev}!`;
                document.getElementById('arrived-car').innerHTML = me.auto;
                document.getElementById('arrived-laps').innerHTML = `${me.korszam} kör`;
            } else if (me.status === 'VEZETÉSRE_VÁR') {
                document.getElementById('phase-waiting').style.display = 'block';
                const azonosAutosok = vendegek.filter(v => v.auto === me.auto && v.status === 'VEZETÉSRE_VÁR');
                azonosAutosok.sort((a, b) => a.idopont.localeCompare(b.idopont));
                const index = azonosAutosok.findIndex(v => v.id === myId);
                document.getElementById('queue-number').innerHTML = index;
            } else if (me.status === 'BEHÍVVA') {
                document.getElementById('phase-called').style.display = 'block';
                document.getElementById('called-car').innerHTML = me.auto;
            } else if (me.status === 'TELJESÍTETT' && me.ertekeles === null) {
                document.getElementById('phase-rating').style.display = 'block';
            }
        }

        function listenToMyEvents() {
            socket.off(`hangjelzes_${myId}`);
            socket.on(`hangjelzes_${myId}`, () => {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(880, audioCtx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                osc.start(); osc.stop(audioCtx.currentTime + 1);
            });
        }
    </script>
</body>
</html>
