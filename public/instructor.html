<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRX SPORT - Instruktori Panel</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 { color: #e10600; text-align: center; margin-bottom: 30px; }
        .card {
            background-color: #1e1e1e;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }
        h2 { color: #fff; border-bottom: 2px solid #e10600; padding-bottom: 10px; margin-top: 0; }
        h3 { color: #ccc; margin-top: 20px; }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #ccc;
        }
        select {
            width: 100%;
            padding: 12px;
            border-radius: 5px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: white;
            box-sizing: border-box;
            font-size: 16px;
        }
        .btn-submit {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }
        .btn-submit:hover { background-color: #0056b3; }
        
        .table-responsive { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background-color: #1a1a1a;
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #333;
        }
        th { background-color: #252525; color: #aaa; }
        
        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            display: inline-block;
        }
        .status-yellow { background-color: #ffcc00; color: #000; }
        .status-green { background-color: #28a745; color: #fff; }
        .status-blue { background-color: #007bff; color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏎️ DRX SPORT - Instruktori Panel</h1>

        <!-- 1. BEJELENTKEZÉSI PANEL -->
        <div id="loginCard" class="card">
            <h2>Napi munkakezdés / Autó választás</h2>
            <form id="instruktorLoginForm">
                <div class="form-group">
                    <label for="instruktorNev">Ki vagy?</label>
                    <select id="instruktorNev" required></select>
                </div>
                <div class="form-group">
                    <label for="instruktorAuto">Melyik autót viszed ma?</label>
                    <select id="instruktorAuto" required></select>
                </div>
                <button type="submit" class="btn-submit">Bejelentkezés és pult indítása</button>
            </form>
        </div>

        <!-- 2. AKTÍV VEZETÉSI PANEL -->
        <div id="mainPanel" class="card" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 id="panelCim" style="border: none; margin: 0;">Aktív Autó: -</h2>
                <span id="instruktorBadge" class="status-badge status-blue" style="font-size: 16px;">-</span>
            </div>

            <h3>Vezetésre váró sor (Időrendben)</h3>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Időpont</th>
                            <th>Vendég Neve</th>
                            <th>Körszám</th>
                            <th>Extrák</th>
                            <th>Állapot</th>
                            <th>Műveletek</th>
                        </tr>
                    </thead>
                    <tbody id="instruktorVendegLista"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let valasztottInstruktor = null;
        let valasztottAuto = null;

        // Adatok betöltése az API-kból
        fetch('/api/instruktorok')
            .then(res => res.json())
            .then(nevek => {
                const select = document.getElementById('instruktorNev');
                nevek.forEach(nev => {
                    let opt = document.createElement('option');
                    opt.value = nev;
                    opt.innerHTML = nev;
                    select.appendChild(opt);
                });
            });

        fetch('/api/autok')
            .then(res => res.json())
            .then(autok => {
                const select = document.getElementById('instruktorAuto');
                autok.forEach(auto => {
                    let opt = document.createElement('option');
                    opt.value = auto;
                    opt.innerHTML = auto;
                    select.appendChild(opt);
                });
            });

        // Bejelentkezés kezelése
        document.getElementById('instruktorLoginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            valasztottInstruktor = document.getElementById('instruktorNev').value;
            valasztottAuto = document.getElementById('instruktorAuto').value;

            socket.emit('instruktorBejelentkezes', { nev: valasztottInstruktor, auto: valasztottAuto });

            document.getElementById('loginCard').style.display = 'none';
            document.getElementById('mainPanel').style.display = 'block';
            document.getElementById('panelCim').innerHTML = `🏎️ Autó: <strong>${valasztottAuto}</strong>`;
            document.getElementById('instruktorBadge').innerHTML = `Pilóta: ${valasztottInstruktor}`;
        });

        // Élő lista frissítése és szűrése autók szerint
        socket.on('vendegekFrissitese', (vendegek) => {
            if (!valasztottAuto) return;

            const tbody = document.getElementById('instruktorVendegLista');
            tbody.innerHTML = '';

            const aktualisVendegek = vendegek.filter(v => v.auto === valasztottAuto && v.status !== 'TELJESÍTETT');

            if (aktualisVendegek.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #888; padding: 20px;">Nincs regisztrált vendég ehhez az autóhoz jelenleg.</td></tr>`;
                return;
            }

            // Időpont szerinti rendezés
            aktualisVendegek.sort((a, b) => a.idopont.localeCompare(b.idopont));

            aktualisVendegek.forEach(v => {
                const tr = document.createElement('tr');

                let statusClass = '';
                let statusText = v.status;
                let gombokHtml = '';

                if (v.status === 'MEGÉRKEZETT') {
                    statusClass = 'status-yellow';
                    statusText = 'Irodánál kész';
                    gombokHtml = `<span style="color: #666; font-size: 14px;">Mobil csekkolásra vár</span>`;
                } else if (v.status === 'VEZETÉSRE_VÁR') {
                    statusClass = 'status-green';
                    statusText = 'Vezetésre vár';
                    gombokHtml = `<button class="btn-submit" style="background-color: #28a745; padding: 8px 15px; font-size: 14px;" onclick="vendegHivasa('${v.id}')">📢 VENDÉG HÍVÁSA</button>`;
                } else if (v.status === 'BEHÍVVA') {
                    statusClass = 'status-blue';
                    statusText = 'Behívva';
                    gombokHtml = `<button class="btn-submit" style="background-color: #dc3545; padding: 8px 15px; font-size: 14px;" onclick="menetLezarasa('${v.id}')">🏁 MENET LEZÁRÁSA</button>`;
                }

                tr.innerHTML = `
                    <td><strong>${v.idopont}</strong></td>
                    <td>${v.nev} <br><small style="color: #ffcc00;">ID: ${v.id}</small></td>
                    <td>${v.korszam} kör</td>
                    <td>${v.extra.join(', ') || 'Nincs'}</td>
                    <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                    <td>${gombokHtml}</td>
                `;
                tbody.appendChild(tr);
            });
        });

        window.vendegHivasa = function(id) {
            socket.emit('vendegHivasa', id);
        };

        window.menetLezarasa = function(id) {
            if(confirm("Biztosan lezárod a menetet? A vendégnél ekkor felugrik az értékelő panel.")) {
                socket.emit('menetLezarasa', id);
            }
        };
    </script>
</body>
</html>
