<!DOCTYPE html>
<html lang="hu">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRX SPORT - Instruktor Panel</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { --drx-red: #ff003c; --drx-yellow: #ffcc00; --drx-dark: #121212; --drx-card: #1c1c1e; }
        body { font-family: Arial, sans-serif; background-color: var(--drx-dark); color: #fff; padding: 15px; margin: 0; }
        select { width: 100%; padding: 15px; background: var(--drx-card); color: #fff; border: 1px solid #333; font-size: 1.1rem; border-radius: 8px; margin-bottom: 20px; }
        .card { background: var(--drx-card); padding: 15px; border-radius: 8px; margin-bottom: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .status-Várakozik { border-left: 6px solid #666; }
        .status-Megérkezett { border-left: 6px solid #007bff; }
        .status-Behívva { border-left: 6px solid var(--drx-yellow); animation: blink 1s infinite alternate; }
        .status-Úton { border-left: 6px solid #28a745; background: #07220d; }
        button { background: linear-gradient(135deg, var(--drx-yellow), #cc9900); color: #000; padding: 12px 20px; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; text-transform: uppercase; width: 100%; font-size: 1rem; margin-top: 10px; }
        @keyframes blink { 0% { opacity: 0.7; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <h2 style="font-family:'Impact'; letter-spacing: 1px;">🏎️ DRX INSTRUKTOR</h2>
    <label>Válaszd ki az autódat:</label>
    <select id="car-select" onchange="connectCar()">
        <option value="">-- VÁLASSZ AUTÓT --</option>
    </select>
    <div id="driver-list">Válassz autót a lista megtekintéséhez.</div>
    <script>
        const socket = io();
        let selectedCar = "";
        const cars = [
            "BMW M4 Competition", "Chevrolet Camaro SS", "Dodge Challenger Hellcat 500LE", "Dodge Challenger Hellcat 700LE", 
            "Ferrari 458 Italia", "Ferrari 488 GTB", "Ferrari F8 Tributo", "Ferrari 458 Challenge Race Taxi", "Ferrari California",  
            "Ford Mustang Shelby GT350", "Ford Mustang 5.0 (automata)", "Ford Mustang 5.0 (manuális)", "Ford Mustang Mach 1", 
            "Ford Mustang Roush", "Shelby AC Cobra", "Lamborghini Gallardo Superleggera", "Lamborghini Huracan", 
            "Mercedes-AMG GT 63 PRO", "Mercedes-AMG GT S", "Mitsubishi Evo IX.", "Mustang Eleanor 67′", "Nissan GT-R 800 LE", 
            "Nissan GT-R 650 LE", "Nissan GT-R 1020 LE", "Porsche 911 GT3", "Porsche 911 GTS", "Porsche 911 Turbo S", 
            "Formula Renault", "Scania R500", "Subaru WRX", "Toyota Yaris GR", "VIP ALLIN FORMULA VEZETÉS", "Trükkös Suzuki"
        ];
        const select = document.getElementById('car-select');
        cars.forEach(car => { select.innerHTML += `<option value="${car}">${car}</option>`; });
        function connectCar() {
            selectedCar = select.value;
            if(!selectedCar) return;
            socket.emit('instructor-connect', selectedCar);
        }
        socket.on('update-instructor-list', (drivers) => {
            const listDiv = document.getElementById('driver-list');
            listDiv.innerHTML = '';
            if(drivers.length === 0) { listDiv.innerHTML = '<p style="color:#666;">Nincs mára ütemezett vendég ehhez az autóhoz.</p>'; return; }
            drivers.forEach(d => {
                let cleanStatus = d.status.split(' ')[0];
                listDiv.innerHTML += `
                    <div class="card status-${cleanStatus}">
                        <h3 style="margin:0 0 5px 0;">${d.time} - ${d.name}</h3>
                        <p style="margin:3px 0; color:#aaa;">Kód: <b>${d.code}</b> | Körök: <b>${d.laps}</b></p>
                        <p style="margin:3px 0; color:#ff003c;">Extrák: <b>${d.extras || 'Nincs'}</b></p>
                        <p style="margin:5px 0 0 0;">Státusz: <b style="color:var(--drx-yellow)">${d.status}</b></p>
                        ${d.status === 'Megérkezett (Váróban)' ? `<button onclick="call('${d.code}')">📢 BEHÍVÁS</button>` : ''}
                    </div>
                `;
            });
        });
        function call(code) { socket.emit('call-guest', { car: selectedCar, code: code }); }
    </script>
</body>
</html>
